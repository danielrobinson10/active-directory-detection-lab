# Splunk Universal Forwarder — inputs.conf
# Location on each Windows host:
#   C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Ships Windows Event Logs + Sysmon into the "endpoint" index on SPLUNK01 (10.10.10.10:9997).

[WinEventLog://Application]
index = endpoint
disabled = false

[WinEventLog://Security]
index = endpoint
disabled = false

[WinEventLog://System]
index = endpoint
disabled = false

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
index = endpoint
disabled = false
renderXml = true
source = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
